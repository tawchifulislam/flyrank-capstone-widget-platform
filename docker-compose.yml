services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
      POSTGRES_DB: widgets
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U widget -d widgets']
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - '3001:3001'
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgres://widget:widget@db:5432/widgets
      PUBLIC_BASE_URL: http://localhost:3001
      GEO_PROVIDER_A_ENABLED: ${GEO_PROVIDER_A_ENABLED:-true}
      GEO_PROVIDER_B_ENABLED: ${GEO_PROVIDER_B_ENABLED:-true}
      EMAIL_SIDE_EFFECT_FAIL: ${EMAIL_SIDE_EFFECT_FAIL:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
